name: Build Windows installer

# Publishing a release is a single tag push:
#   git tag v0.3.0 && git push origin v0.3.0
# This builds librespot from source (pinned), freezes the app with PyInstaller,
# packages the Inno Setup installer, and attaches it to the GitHub Release for
# the tag. `workflow_dispatch` runs the same build and uploads the installer as
# a workflow artifact (for test runs, without touching a release).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # The one place the pinned librespot version lives. Bumping it is a deliberate
  # edit; the cache key below is derived from it, so it only recompiles then.
  LIBRESPOT_VERSION: "0.8.0"
  PYTHON_VERSION: "3.12"
  # Pinned helper programs shipped inside the installer (nothing is downloaded on
  # the user's machine at install time). Bump deliberately, like LIBRESPOT_VERSION.
  # MPV_TAG is a shinchiro/mpv-winbuild-cmake release (date tag); YTDLP_VERSION a
  # yt-dlp release. yt-dlp is the one most likely to need frequent bumps (YouTube
  # changes break it); the standalone yt-dlp.exe can also update itself: `yt-dlp -U`.
  MPV_TAG: "20261108"
  YTDLP_VERSION: "2026.10.26"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          # Single source of truth: spt_tui/__init__.py. Read it without importing
          # the app (no deps needed yet).
          $v = python -c "import re, pathlib; print(re.search(r'__version__\s*=\s*\""([^\""]+)\""', pathlib.Path('spt_tui/__init__.py').read_text()).group(1))"
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Package version: $v"
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tag -ne $v) {
              Write-Error "Tag '$tag' does not match package version '$v'. Bump spt_tui/__init__.py to match the tag."
              exit 1
            }
          }

      - name: Cache librespot binary
        id: cache-librespot
        uses: actions/cache@v4
        with:
          path: librespot-bin
          key: librespot-${{ env.LIBRESPOT_VERSION }}-windows

      - name: Build librespot (from source, pinned)
        if: steps.cache-librespot.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          rustup default stable
          # --locked is mandatory: without the published lockfile a newer
          # transitive dependency (vergen/vergen-lib) fails to compile.
          cargo install librespot --version $env:LIBRESPOT_VERSION --locked --root librespot-cargo
          New-Item -ItemType Directory -Force -Path librespot-bin | Out-Null
          Copy-Item librespot-cargo\bin\librespot.exe librespot-bin\librespot.exe

      - name: Verify librespot
        shell: pwsh
        run: |
          librespot-bin\librespot.exe --version
          # librespot 0.8.0 cannot list its audio backends: `--backend ?` only prints
          # the version banner and exits 0 (so it can't be used as a check). Instead,
          # confirm the rodio crate (and its cpal device layer) is compiled into the
          # binary: their versioned crate paths are embedded in release builds.
          $exe = "librespot-bin\librespot.exe"
          $text = [System.Text.Encoding]::Latin1.GetString([System.IO.File]::ReadAllBytes((Resolve-Path $exe)))
          $rodio = [regex]::Match($text, "rodio-[0-9]+\.[0-9]+\.[0-9]+")
          if (-not $rodio.Success) { Write-Error "rodio backend missing from librespot.exe"; exit 1 }
          if ($text -notmatch "cpal-[0-9]+\.[0-9]+\.[0-9]+") { Write-Error "cpal missing from librespot.exe"; exit 1 }
          Write-Host "librespot includes $($rodio.Value)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install app (with provider extras) and PyInstaller
        # The extras are what put ytmusicapi, yt-dlp and keyring into the frozen
        # app. Without them the YouTube Music / Subsonic providers show up as
        # "unavailable" in the installed build.
        run: pip install ".[ytmusic,subsonic]" pyinstaller

      - name: Freeze the app
        run: pyinstaller spt.spec --noconfirm

      - name: Bundle librespot beside the app
        shell: pwsh
        run: Copy-Item librespot-bin\librespot.exe dist\spt\librespot.exe

      - name: Fetch mpv and yt-dlp (pinned) and bundle them beside the app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # yt-dlp: standalone exe, verified against the release's published checksums.
          $base = "https://github.com/yt-dlp/yt-dlp/releases/download/$env:YTDLP_VERSION"
          Invoke-WebRequest "$base/yt-dlp.exe" -OutFile dist\spt\yt-dlp.exe -MaximumRetryCount 5 -RetryIntervalSec 10
          Invoke-WebRequest "$base/SHA2-256SUMS" -OutFile ytdlp-sums.txt -MaximumRetryCount 5 -RetryIntervalSec 10
          $want = ((Select-String -Path ytdlp-sums.txt -Pattern "\s\*?yt-dlp\.exe$").Line -split "\s+")[0].ToLower()
          $got = (Get-FileHash dist\spt\yt-dlp.exe -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { Write-Error "yt-dlp.exe checksum mismatch ($got != $want)"; exit 1 }
          # mpv: pinned shinchiro build (plain x86_64, no -v3, so it runs on any x64 CPU).
          $rel = Invoke-RestMethod "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/tags/$env:MPV_TAG" -MaximumRetryCount 5 -RetryIntervalSec 10
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-x86_64-\d{8}-git-[0-9a-f]+\.7z$' } | Select-Object -First 1
          if (-not $asset) { Write-Error "No mpv x86_64 asset in release $env:MPV_TAG"; exit 1 }
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv.7z -MaximumRetryCount 5 -RetryIntervalSec 10
          7z x mpv.7z -ompv-extract -y | Out-Null
          Copy-Item mpv-extract\mpv.exe dist\spt\mpv.exe
          Get-ChildItem mpv-extract -Filter *.dll | Copy-Item -Destination dist\spt\
          Write-Host "Bundled $($asset.name)"

      - name: Smoke test the frozen app
        shell: pwsh
        run: |
          $out = & dist\spt\spt.exe --version | Out-String
          Write-Host $out
          if ($out -notmatch [regex]::Escape("${{ steps.ver.outputs.version }}")) {
            Write-Error "Frozen app did not report version ${{ steps.ver.outputs.version }}: $out"
            exit 1
          }
          # The provider extras must really be inside the freeze (these ship as folders via
          # collect_all; pure-Python deps like spotipy live inside the PYZ archive instead).
          foreach ($pkg in "ytmusicapi", "yt_dlp", "keyring") {
            if (-not (Test-Path "dist\spt\_internal\$pkg")) {
              Write-Error "Frozen app is missing the '$pkg' package"; exit 1
            }
          }
          # And the bundled programs must start.
          dist\spt\mpv.exe --version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { Write-Error "bundled mpv.exe does not start"; exit 1 }
          dist\spt\yt-dlp.exe --version
          if ($LASTEXITCODE -ne 0) { Write-Error "bundled yt-dlp.exe does not start"; exit 1 }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\spt-tui.iss

      - name: Compute checksums
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $inst = "dist\installer\SPT-TUI-Setup-$ver.exe"
          $out = "dist\installer\checksums.txt"
          "$((Get-FileHash $inst -Algorithm SHA256).Hash)  SPT-TUI-Setup-$ver.exe" | Out-File -Encoding ascii $out
          "$((Get-FileHash dist\spt\librespot.exe -Algorithm SHA256).Hash)  librespot.exe" | Add-Content -Encoding ascii $out
          foreach ($f in "mpv.exe", "yt-dlp.exe") {
            "$((Get-FileHash dist\spt\$f -Algorithm SHA256).Hash)  $f" | Add-Content -Encoding ascii $out
          }
          Get-Content $out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPT-TUI-Setup-${{ steps.ver.outputs.version }}
          path: |
            dist/installer/SPT-TUI-Setup-*.exe
            dist/installer/checksums.txt

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/SPT-TUI-Setup-*.exe
            dist/installer/checksums.txt
